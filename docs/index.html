<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Daily supermarket price index built from Migros and A101 shelf prices.">
<title>Market Basket Türkiye</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --line: #e2e6ec;
  --ink: #141b26;
  --ink-2: #4a5566;
  --ink-3: #7b8696;
  --nav: #0f2036;
  --nav-2: #18304d;
  --nav-ink: #e8eef6;
  --nav-ink-2: #9fb0c6;
  --accent: #1f6fd1;
  --accent-soft: rgba(31, 111, 209, .12);
  --up: #d23b3b;
  --down: #14945a;
  --s2: #eb6834;
  --s3: #2b62c4;
  --grid: #edf0f4;
  --font: "Archivo", "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1420;
    --surface: #131d2b;
    --line: #223044;
    --ink: #eef2f7;
    --ink-2: #b4c0cf;
    --ink-3: #7f8da0;
    --nav: #08101b;
    --nav-2: #132134;
    --accent: #5b9ef0;
    --accent-soft: rgba(91, 158, 240, .16);
    --up: #f06a6a;
    --down: #3cc486;
    --s3: #6f9cf0;
    --grid: #1b2738;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
a { color: inherit; }
button, select { font: inherit; color: inherit; }

.top { background: var(--nav); color: var(--nav-ink); position: sticky; top: 0; z-index: 5; }
.top .in { max-width: 1240px; margin: 0 auto; padding: 0 16px; height: 52px; display: flex; align-items: center; gap: 28px; }
.brand { font-weight: 800; font-size: 17px; letter-spacing: -.01em; white-space: nowrap; text-decoration: none; }
.brand b { color: #6fb0ff; font-weight: 800; }
.top nav { display: flex; gap: 20px; overflow-x: auto; scrollbar-width: none; }
.top nav a { color: var(--nav-ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.top nav a:hover { color: var(--nav-ink); }
.top .upd { margin-left: auto; color: var(--nav-ink-2); font-size: 12px; white-space: nowrap; }

.ticker { background: var(--nav-2); color: var(--nav-ink); }
.ticker .in { max-width: 1240px; margin: 0 auto; padding: 0 16px; display: flex; overflow-x: auto; scrollbar-width: none; }
.tk { display: flex; align-items: baseline; gap: 8px; padding: 9px 18px 9px 0; margin-right: 18px; border: 0; border-right: 1px solid rgba(255,255,255,.1); background: none; white-space: nowrap; font-size: 13px; cursor: pointer; color: var(--nav-ink); }
.tk:last-child { border-right: 0; }
.tk .n { color: var(--nav-ink-2); }
.tk .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.tk .up { color: #ff8a8a; } .tk .dn { color: #5fd69b; } .tk .flat { color: var(--nav-ink-2); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 20px 16px 0; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }

.hero { padding: 22px 24px 20px; border-left: 4px solid var(--accent); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(24px, 3.2vw, 34px); line-height: 1.12; letter-spacing: -.02em; margin: 8px 0 10px; font-weight: 800; }
.hero p { margin: 0; color: var(--ink-2); font-size: 15px; max-width: 70ch; }
.hero .meta { margin-top: 12px; font-size: 12px; color: var(--ink-3); }

.chartcard { margin-top: 20px; padding: 16px 18px 12px; }
.chead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.chead h2 { margin: 0; font-size: 18px; font-weight: 700; }
.chead .lvl { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chead .chg { font-weight: 600; font-variant-numeric: tabular-nums; }
.chead .rng { color: var(--ink-3); font-size: 12px; }
.ctrl { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin: 12px 0 6px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.tab { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 3px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.tab:hover { border-color: var(--ink-3); }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
select.tab { padding-right: 26px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: right 12px top 55%, right 7px top 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent-soft); color: var(--accent); }
.seg button:disabled { opacity: .35; cursor: default; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); min-height: 18px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.chartbox { position: relative; }
#chart { display: block; width: 100%; height: auto; touch-action: pan-y; font-family: var(--font); }
.tip { position: absolute; pointer-events: none; background: var(--nav); color: var(--nav-ink); border-radius: 3px; padding: 7px 10px; font-size: 12px; opacity: 0; transition: opacity .1s; min-width: 140px; font-variant-numeric: tabular-nums; }
.tip div { display: flex; justify-content: space-between; gap: 14px; }

.stories { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
.story { padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; text-align: left; }
.story:hover { border-color: var(--ink-3); }
.story .k { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.story .t { font-size: 16px; font-weight: 700; line-height: 1.25; }
.story .d { font-size: 13px; color: var(--ink-2); }
.story svg { width: 100%; height: 38px; margin-top: auto; padding-top: 6px; }

.side { position: sticky; top: 72px; }
.side .head { display: flex; border-bottom: 1px solid var(--line); }
.side .head button { flex: 1; border: 0; background: none; padding: 12px 6px 10px; font-weight: 600; font-size: 13px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.side .head button.on { color: var(--ink); border-bottom-color: var(--accent); }
.side .sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 14px; font-size: 12px; color: var(--ink-3); }
.mv { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.mv td { padding: 8px 14px; border-top: 1px solid var(--line); vertical-align: top; }
.mv tr { cursor: pointer; }
.mv tr:hover td { background: var(--bg); }
.mv .nm { font-weight: 600; font-size: 13px; line-height: 1.3; }
.mv .sm { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.mv .r { text-align: right; white-space: nowrap; }
.mv .lv { color: var(--ink-2); padding-right: 0; }
.badge { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .03em; padding: 0 5px; border-radius: 2px; margin-right: 5px; color: #fff; background: var(--ink-3); }
.badge.migros { background: var(--s2); } .badge.a101 { background: #2b62c4; }
.empty { padding: 18px 14px; color: var(--ink-3); font-size: 13px; border-top: 1px solid var(--line); }

.up { color: var(--up); } .dn { color: var(--down); } .flat { color: var(--ink-3); }
.pill { display: inline-block; min-width: 72px; text-align: right; font-weight: 600; }

.band { background: var(--nav); color: var(--nav-ink); margin-top: 32px; }
.band .in { max-width: 1240px; margin: 0 auto; padding: 26px 16px 30px; }
.band h2 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
.band p { margin: 0 0 16px; color: var(--nav-ink-2); font-size: 13px; }
.scroll { overflow-x: auto; }
.all { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 760px; }
.all th { text-align: right; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--nav-ink-2); padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.14); white-space: nowrap; }
.all th:first-child, .all td:first-child { text-align: left; }
.all td { text-align: right; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,.07); white-space: nowrap; }
.all tbody tr { cursor: pointer; }
.all tbody tr:hover td { background: rgba(255,255,255,.05); }
.all tr.lead td { font-weight: 700; }
.all tr.lead + tr:not(.lead) td { border-top: 1px solid rgba(255,255,255,.18); }
.all .up { color: #ff8a8a; } .all .dn { color: #5fd69b; } .all .flat { color: var(--nav-ink-2); }
.all .tag { font-size: 10px; color: var(--nav-ink-2); border: 1px solid rgba(255,255,255,.2); border-radius: 2px; padding: 0 4px; margin-left: 6px; font-weight: 500; }

.method { max-width: 1240px; margin: 0 auto; padding: 28px 16px 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; color: var(--ink-2); font-size: 13px; }
.method h3 { margin: 0 0 6px; font-size: 14px; color: var(--ink); }
.method p { margin: 0; }
footer { max-width: 1240px; margin: 0 auto; padding: 14px 16px 30px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px 20px; }

@media (max-width: 1000px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; }
}
@media (max-width: 720px) {
  .stories, .method { grid-template-columns: minmax(0, 1fr); }
  .top .in { gap: 16px; }
  .top .upd { display: none; }
  .hero { padding: 18px 16px; }
  .chartcard { padding: 14px 12px 10px; }
}
</style>
</head>

</section>

const N = D.dates.length;

const pct = (v, digits = 2) => v == null ? "—" : (v > 0 ? "+" : "") + v.toFixed(digits) + "%";

const state = {series:"food", range:null, side:"cats", period:"w1"};

function headline() {
  const [p, v] = best(D.stats.food);
  const span = p === "m1" ? "over the past month" : "in " + DAYS + " days";
  const verb = v > 0 ? "rose" : v < 0 ? "fell" : "held steady";
  document.getElementById("eyebrow").textContent = "Food prices · " + fmtDate(D.generated, true);
  document.getElementById("headline").textContent = v == null ? "Food price index" :
    `Supermarket food prices ${verb}${v ? " " + Math.abs(v).toFixed(1) + "%" : ""} ${span}`;

  const cats = D.categories.filter(c => c[p] != null).sort((a, b) => b[p] - a[p]);
  const top = cats[0], low = cats.at(-1);
  const parts = [];
  if (top && top[p] > 0) parts.push(`${catName(top.key)} led the increase at ${pct(top[p], 1)}`);
  if (low && low[p] < 0) parts.push(`${catName(low.key).toLowerCase()} got cheaper, ${pct(low[p], 1)}`);
  let text = parts.length ? parts.join(", while ") + ". " : "";
  const st = Object.keys(D.stores).map(s => [D.stores[s], D.stats[s].all]).filter(x => x[1] != null);
  if (st.length === 2) text += `Since ${fmtDate(D.store_start)}, food at ${st[0][0]} moved ${pct(st[0][1], 1)} against ${pct(st[1][1], 1)} at ${st[1][0]}. `;
  text += `The whole basket, with household and personal care, is ${pct(D.stats.overall.all, 1)} since ${fmtDate(D.dates[0])}.`;
  document.getElementById("summary").textContent = text;
  document.getElementById("meta").textContent = num(D.n_today) + " products priced this morning · "
    + Object.entries(D.n_today_store).map(([s, n]) => num(n) + " " + (D.stores[s] || s)).join(" · ");
}

function ticker() {
  const item = (k, label, s) =>
    `<button class="tk" data-k="${k}"><span class="n">${label}</span><span class="v">${s.level.toFixed(2)}</span><span class="${dir(s.d1)}">${arrow(s.d1)} ${pct(s.d1)}</span></button>`;
  const el = document.getElementById("ticker");
  el.innerHTML = [item("food", "Food", D.stats.food), item("overall", "All items", D.stats.overall),
    ...Object.keys(D.stores).map(s => item("stores", D.stores[s], D.stats[s])),
    ...D.categories.map(c => item(c.key, catName(c.key), c))].join("");
  el.onclick = e => { const b = e.target.closest("[data-k]"); if (b) show(b.dataset.k); };
}

function seriesTabs() {
  const el = document.getElementById("series-tabs");
  el.innerHTML = [["food", "Food"], ["overall", "All items"], ["stores", "Migros vs A101"]]
    .map(([k, l]) => `<button class="tab" data-k="${k}">${l}</button>`).join("")
    + `<select class="tab" id="cat-select" aria-label="Category"><option value="">Category</option>`
    + D.categories.map(c => `<option value="${c.key}">${catName(c.key)}</option>`).join("") + `</select>`;
  el.onclick = e => { const b = e.target.closest("button[data-k]"); if (b) show(b.dataset.k, false); };
  document.getElementById("cat-select").onchange = e => { if (e.target.value) show(e.target.value, false); };

  const r = document.getElementById("ranges");
  r.innerHTML = RANGES.map(([l, d]) => `<button data-d="${d ?? ""}"${d && d >= DAYS ? " disabled" : ""}>${l}</button>`).join("");
  r.onclick = e => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    state.range = b.dataset.d ? +b.dataset.d : null; drawChart();
  };
}

function show(key, scroll = true) {
  state.series = key; drawChart();
  if (scroll) document.getElementById("chartcard").scrollIntoView({behavior:"smooth", block:"center"});
}

function niceStep(range) {
  const raw = range / 5, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}

function drawChart() {
  const def = SERIES[state.series];
  document.querySelectorAll("#series-tabs button").forEach(b => b.classList.toggle("on", b.dataset.k === state.series));
  const sel = document.getElementById("cat-select");
  sel.value = D.categories.some(c => c.key === state.series) ? state.series : "";
  sel.classList.toggle("on", !!sel.value);
  document.querySelectorAll("#ranges button").forEach(b => b.classList.toggle("on", (b.dataset.d ? +b.dataset.d : null) === state.range));

  let start = 0;
  if (state.range) {
    const cut = new Date(toDate(D.dates[N - 1]).getTime() - state.range * 86400000).toISOString().slice(0, 10);
    start = Math.max(0, D.dates.findIndex(d => d >= cut));
  }
  const idx = [...Array(N - start).keys()].map(i => i + start);
  const lines = def.lines.map(l => ({...l, v: idx.map(i => D.series[l.key][i])}));
  const change = l => { const a = l.v.find(v => v != null), b = l.v.at(-1); return a != null && b != null ? (b / a - 1) * 100 : null; };

  const first = Math.max(0, lines[0].v.findIndex(v => v != null));
  const lastV = lines[0].v.at(-1);
  document.getElementById("c-title").textContent = def.title;
  document.getElementById("c-level").textContent = lines.length === 1 && lastV != null ? lastV.toFixed(2) : "";
  document.getElementById("c-change").innerHTML = lines.length === 1 ? chip(change(lines[0]))
    : lines.map(l => `${esc(l.label)} ${chip(change(l))}`).join(" &nbsp; ");
  document.getElementById("c-range").textContent = fmtDate(D.dates[idx[first]]) + " – " + fmtDate(D.dates[N - 1], true);
  document.getElementById("legend").innerHTML = lines.length > 1
    ? lines.map(l => `<span><i style="background:${l.color}"></i>${esc(l.label)}</span>`).join("") : "";

  const svg = document.getElementById("chart"), tip = document.getElementById("tip");
  tip.style.opacity = "0";
  const W = Math.max(300, Math.round(document.getElementById("chartbox").clientWidth)), H = W < 560 ? 240 : 320;
  const L = 8, R = 56, T = 14, B = 28;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const vals = lines.flatMap(l => l.v).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi - lo) * 0.12, 0.4);
  lo -= pad; hi += pad;
  const step = niceStep(hi - lo);
  const n = idx.length;
  const x = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));

  let out = `<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>`;
  const tags = lines.map(l => l.v.at(-1)).filter(v => v != null).map(y);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    out += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--grid)"/>`;
    if (tags.every(t => Math.abs(t - y(v)) > 14)) out += `<text x="${W - R + 8}" y="${(y(v) + 4).toFixed(1)}" fill="var(--ink-3)" font-size="11">${+v.toFixed(2)}</text>`;
  }
  const ticks = Math.min(W < 560 ? 4 : 6, n), seen = new Set();
  for (let t = 0; t < ticks; t++) {
    const i = Math.round(t * (n - 1) / Math.max(ticks - 1, 1));
    if (seen.has(i)) continue; seen.add(i);
    const anchor = ticks === 1 ? "middle" : t === 0 ? "start" : t === ticks - 1 ? "end" : "middle";
    out += `<text x="${x(i).toFixed(1)}" y="${H - 8}" fill="var(--ink-3)" font-size="11" text-anchor="${anchor}">${fmtDate(D.dates[idx[i]])}</text>`;
  }
  if (lo < 100 && hi > 100) out += `<line x1="${L}" x2="${W - R}" y1="${y(100).toFixed(1)}" y2="${y(100).toFixed(1)}" stroke="var(--ink-3)" stroke-dasharray="2 4" opacity=".7"/>`;

  lines.forEach(l => {
    const segs = []; let cur = [];
    l.v.forEach((v, i) => { if (v == null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([x(i), y(v)]); });
    if (cur.length) segs.push(cur);
    segs.forEach(s => {
      const pts = s.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
      if (lines.length === 1 && s.length > 1) out += `<polygon points="${s[0][0].toFixed(1)},${H - B} ${pts} ${s.at(-1)[0].toFixed(1)},${H - B}" fill="url(#fill)"/>`;
      out += `<polyline points="${pts}" fill="none" stroke="${l.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;

      out += `<rect x="${W - R + 3}" y="${(y(last) - 9).toFixed(1)}" width="${R - 4}" height="18" rx="2" fill="${l.color}"/>`;
      out += `<text x="${W - R + 7}" y="${(y(last) + 4).toFixed(1)}" fill="#fff" font-size="11" font-weight="600">${last.toFixed(2)}</text>`;
    }

    const i = Math.max(0, Math.min(n - 1, Math.round((px - L) / (W - L - R) * (n - 1))));

  const v = values.filter(x => x != null);
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((p, i) => `${(i / (v.length - 1) * 200).toFixed(1)},${(35 - (p - lo) / span * 32).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 200 38" preserveAspectRatio="none" class="${cls}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function stories() {
  const [p] = best(D.stats.food);
  const when = p === "m1" ? "this month" : "since " + fmtDate(D.dates[0]);
  const cats = D.categories.filter(c => c[p] != null).sort((a, b) => b[p] - a[p]);
  const cards = [];
  if (cats.length) {
    const t = cats[0], b = cats.at(-1);
    cards.push({k:t.key, label:"Biggest rise " + when, title:`${catName(t.key)} ${pct(t[p], 1)}`,
      text:`Index ${t.level.toFixed(2)} · ${num(total(t))} products`, spark:dir(t[p])});
    cards.push({k:b.key, label:(b[p] < 0 ? "Biggest fall " : "Smallest rise ") + when, title:`${catName(b.key)} ${pct(b[p], 1)}`,
      text:`Index ${b.level.toFixed(2)} · ${num(total(b))} products`, spark:dir(b[p])});
  }
  const week = D.movers.w1.up[0], pm = week || D.movers.all.up[0];
  if (pm) cards.push({k:pm.cat, label:"Top product " + (week ? "this week" : "since first seen"), title:`${pm.name} ${pct(pm.pct, 1)}`,
    text:`${D.stores[pm.store] || pm.store} · ${pm.tl.toFixed(2)} TL · ${catName(pm.cat)}`});
  const el = document.getElementById("stories");
  el.innerHTML = cards.map(c =>
    `<button class="card story" data-k="${c.k}"><span class="k">${esc(c.label)}</span><span class="t">${esc(c.title)}</span><span class="d">${esc(c.text)}</span>${c.spark ? spark(D.series[c.k], c.spark) : ""}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("[data-k]"); if (b) show(b.dataset.k); };
}

function side() {
  document.getElementById("side-tabs").innerHTML = [["cats", "Categories"], ["up", "Rising"], ["down", "Falling"]]
    .map(([k, l]) => `<button data-k="${k}" class="${state.side === k ? "on" : ""}">${l}</button>`).join("");
  const periods = state.side === "cats" ? [["d1", "1D"], ["w1", "1W"], ["m1", "1M"], ["all", "All"]] : [["w1", "1W"], ["all", "All"]];
  if (!periods.some(p => p[0] === state.period)) state.period = "w1";
  document.getElementById("side-period").innerHTML = periods
    .map(([k, l]) => `<button data-p="${k}" class="${state.period === k ? "on" : ""}">${l}</button>`).join("");

  const body = document.getElementById("side-body");
  if (state.side === "cats") {
    document.getElementById("side-note").textContent = "Index · change over " + PERIOD_LABEL[state.period];
    const rows = [...D.categories].sort((a, b) => (b[state.period] ?? -1e9) - (a[state.period] ?? -1e9));
    body.innerHTML = `<table class="mv">` + rows.map(c =>
      `<tr data-k="${c.key}"><td><div class="nm">${catName(c.key)}</div><div class="sm">${c.food ? "Food" : "Non-food"} · ${num(total(c))} products</div></td>
       <td class="r lv">${c.level.toFixed(2)}</td><td class="r"><span class="pill">${chip(c[state.period])}</span></td></tr>`).join("") + `</table>`;
  } else {
    const list = D.movers[state.period][state.side];
    document.getElementById("side-note").textContent = "Per kg/L · " + (state.period === "w1" ? "last 7 days" : "since first seen");
    body.innerHTML = list.length ? `<table class="mv">` + list.map(m =>
      `<tr data-k="${m.cat}"><td><div class="nm">${esc(m.name)}</div><div class="sm"><span class="badge ${esc(m.store)}">${esc(D.stores[m.store] || m.store)}</span>${catName(m.cat)} · ${m.tl.toFixed(2)} TL</div></td>
       <td class="r"><span class="pill">${chip(m.pct, 1)}</span></td></tr>`).join("") + `</table>`
      : `<div class="empty">No product moved over this period yet.</div>`;
  }
}

function sideEvents() {
  document.getElementById("side-tabs").onclick = e => { const b = e.target.closest("[data-k]"); if (b) { state.side = b.dataset.k; side(); } };
  document.getElementById("side-period").onclick = e => { const b = e.target.closest("[data-p]"); if (b) { state.period = b.dataset.p; side(); } };
  document.getElementById("side-body").onclick = e => { const r = e.target.closest("[data-k]"); if (r) show(r.dataset.k); };
}

function table() {
  const stores = Object.keys(D.stores);
  const cell = v => `<td class="${dir(v)}">${v == null ? "—" : arrow(v) + " " + pct(v)}</td>`;
  const row = (k, label, s, weight, counts, cls) =>
    `<tr class="${cls}" data-k="${k}"><td>${label}</td><td>${weight.toFixed(1)}</td><td>${s.level.toFixed(2)}</td>${cell(s.d1)}${cell(s.w1)}${cell(s.m1)}${cell(s.all)}`
    + stores.map(st => `<td>${num(counts[st] || 0)}</td>`).join("") + `</tr>`;
  const sum = cats => ({weight:cats.reduce((a, c) => a + c.weight, 0),
    counts:Object.fromEntries(stores.map(st => [st, cats.reduce((a, c) => a + (c.counts[st] || 0), 0)]))});
  const food = sum(D.categories.filter(c => c.food)), all = sum(D.categories);
  const el = document.getElementById("all");
  el.innerHTML = `<thead><tr><th>Category</th><th>Weight</th><th>Index</th><th>1D</th><th>1W</th><th>1M</th><th>Since start</th>`
    + stores.map(s => `<th>${esc(D.stores[s])} items</th>`).join("") + `</tr></thead><tbody>`
    + row("food", "Food basket", D.stats.food, food.weight, food.counts, "lead")
    + row("overall", "All items", D.stats.overall, all.weight, all.counts, "lead")
    + [...D.categories].sort((a, b) => b.weight - a.weight).map(c =>
        row(c.key, catName(c.key) + (c.food ? "" : '<span class="tag">non-food</span>'), c, c.weight, c.counts, "")).join("")
    + `</tbody>`;
  el.onclick = e => { const r = e.target.closest("tr[data-k]"); if (r) show(r.dataset.k); };
}

function method() {
  document.getElementById("method").innerHTML = `
<div><h3>The method</h3><p>Each product is compared only with itself, per kilo or litre where a package size is known, so a smaller pack at the same price counts as a price rise. Within each shelf the daily changes are combined as a geometric mean, shelves are averaged into categories, and categories are weighted with TurkStat's 2026 CPI division weights.</p></div>
<div><h3>Food is the headline</h3><p>The food basket covers ten categories at two chains and has the widest coverage, so it is the number to quote. All items adds household cleaning and personal care, which carry a large slice of the official weights.</p></div>
<div><h3>Promotions are in here</h3><p>Both chains sometimes put a campaign price in the shelf-price field. ${D.jumps} one-day moves above 25% show up in the period; short dips that snap back are usually that, not inflation. ${DAYS} days is still a short window, so read the direction rather than an annualised figure.</p></div>`;
}

let lastWidth = 0;
window.addEventListener("resize", () => {
  const w = document.getElementById("chartbox").clientWidth;
  if (Math.abs(w - lastWidth) > 4) { lastWidth = w; drawChart(); }
});

headline();
ticker();
seriesTabs();
drawChart();
stories();
side();
sideEvents();
table();
method();
document.getElementById("upd").textContent = "Updated " + fmtDate(D.generated, true);
document.getElementById("foot-gen").textContent = "Updated " + fmtDate(D.generated, true) + " · " + N + " days of data · " + num(D.n_today) + " products";
</script>
</body>
</html>
